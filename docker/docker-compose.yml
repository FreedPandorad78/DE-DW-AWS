name: de-dw

services:
  # PostgreSQL guarda solo los metadatos de Airflow. Las ventas están en RDS, DocumentDB y Redshift.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copia docker/.env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migración y usuario administrador antes de levantar Airflow.
  airflow-init:
    image: local/ecommerce-airflow:2.11.2
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Define AIRFLOW_FERNET_KEY en .env}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Define AIRFLOW_SECRET_KEY en .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/src
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      # Servicios de AWS. Sin contraseñas aquí: los secretos se leen de Secrets Manager con el rol de la EC2.
      AWS_REGION: ${AWS_REGION:-us-east-2}
      S3_BUCKET: ${S3_BUCKET:?Define S3_BUCKET en .env}
      RDS_HOST: ${RDS_HOST:?Define RDS_HOST en .env}
      RDS_SECRET_ARN: ${RDS_SECRET_ARN:?Define RDS_SECRET_ARN en .env}
      RDS_CA_BUNDLE: /opt/certs/global-bundle.pem
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      DOCDB_HOST: ${DOCDB_HOST:?Define DOCDB_HOST en .env}
      DOCDB_SECRET_ARN: ${DOCDB_SECRET_ARN:?Define DOCDB_SECRET_ARN en .env}
      DOCDB_CA_BUNDLE: /opt/certs/global-bundle.pem
      MONGO_DATABASE: ${MONGO_DATABASE:-ecommerce}
      REDSHIFT_HOST: ${REDSHIFT_HOST:?Define REDSHIFT_HOST en .env}
      REDSHIFT_SECRET_ARN: ${REDSHIFT_SECRET_ARN:?Define REDSHIFT_SECRET_ARN en .env}
      REDSHIFT_IAM_ROLE_ARN: ${REDSHIFT_IAM_ROLE_ARN:?Define REDSHIFT_IAM_ROLE_ARN en .env}
      REDSHIFT_DATABASE: ${REDSHIFT_DATABASE:-dev}
      DAG_SCHEDULE: ${DAG_SCHEDULE:-}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Define AIRFLOW_ADMIN_PASSWORD en .env}
    user: "${AIRFLOW_UID:-50000}:0"
    volumes: &airflow-volumes
      - ./src/airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs
      - ./extracts:/opt/airflow/extracts
    depends_on:
      postgres:
        condition: service_healthy
    command: version

  # Interfaz web. Solo escucha en 127.0.0.1: se abre con un túnel SSH.
  airflow-webserver:
    image: local/ecommerce-airflow:2.11.2
    command: webserver
    environment: *airflow-environment
    user: "${AIRFLOW_UID:-50000}:0"
    volumes: *airflow-volumes
    ports:
      - "127.0.0.1:${AIRFLOW_UI_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Programa y ejecuta las tareas con LocalExecutor.
  airflow-scheduler:
    image: local/ecommerce-airflow:2.11.2
    command: scheduler
    environment: *airflow-environment
    user: "${AIRFLOW_UID:-50000}:0"
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_logs:
  postgres_data:
